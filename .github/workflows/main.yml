name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Create placeholder GeminiConfig.kt
        run: |
          F=app/src/main/java/com/example/cloudesk/GeminiConfig.kt
          if [ ! -f "$F" ]; then
            if [ -f "$F.example" ]; then cp "$F.example" "$F"; else
              printf 'package com.example.cloudesk\n\nobject GeminiConfig {\n    const val API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE"\n    const val MODEL = "gemini-3.6-flash"\n}\n' > "$F"
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CloudDesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
