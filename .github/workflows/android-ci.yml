
name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_TOOL_OPTIONS: "-Xmx2g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GeminiConfig.kt contains the real API key locally.
      # CI creates a placeholder if the file is missing.
      - name: Create placeholder GeminiConfig.kt
        shell: bash
        run: |
          F="app/src/main/java/com/example/cloudesk/GeminiConfig.kt"
          mkdir -p "$(dirname "$F")"

          if [ ! -f "$F" ]; then
            if [ -f "$F.example" ]; then
              cp "$F.example" "$F"
            else
              printf 'package com.example.cloudesk\n\nobject GeminiConfig {\n    const val API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE"\n    const val MODEL = "gemini-3.6-flash"\n}\n' > "$F"
            fi
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: >-
          ./gradlew
          -Pkotlin.compiler.execution.strategy=in-process
          testDebugUnitTest
          --stacktrace
          --no-daemon

      - name: Build debug APK
        run: >-
          ./gradlew
          -Pkotlin.compiler.execution.strategy=in-process
          assembleDebug
          --stacktrace
          --no-daemon

      - name: Run Android lint
        run: >-
          ./gradlew
          -Pkotlin.compiler.execution.strategy=in-process
          lintDebug
          --stacktrace
          --no-daemon

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CloudDesk-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
